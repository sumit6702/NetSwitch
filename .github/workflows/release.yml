name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APKs for Release
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}"
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-release.apk "release-apks/NetSwitch-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "release-apks/NetSwitch-${TAG}-debug.apk"
          ls -lh release-apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetSwitch-APKs
          path: release-apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: NetSwitch ${{ github.ref_name || github.event.inputs.tag_name }}
          files: release-apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
